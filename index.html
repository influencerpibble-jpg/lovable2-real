<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteForge</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toast"></div>
<section id="auth" class="center"><div class="card auth"><h1>SiteForge</h1><p>Crie, edite e publique sites.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha (mín. 6 caracteres)"><div class="row"><button id="login">Entrar</button><button id="signup" class="secondary">Criar conta</button></div><small id="authMsg"></small></div></section>
<section id="app" hidden><aside><div><h2>SiteForge</h2><button id="newProject">＋ Novo projeto</button><div id="projects"></div></div><button id="logout" class="ghost">Sair</button></aside><main><header><div><input id="title" class="title" value="Novo site"><span id="saveState">Salvo</span></div><div class="row"><button id="save" class="secondary">Salvar</button><button id="publish">Publicar</button></div></header><div class="workspace"><section class="builder"><label>Peça uma alteração</label><textarea id="prompt" placeholder="Ex.: crie uma landing page escura para um estúdio de Roblox..."></textarea><button id="generate">✨ Gerar / aplicar</button><div class="tabs"><button data-tab="html" class="active">HTML</button><button data-tab="css">CSS</button></div><textarea id="code" class="code"></textarea><div id="publishResult"></div></section><section class="preview"><div class="previewbar">Preview</div><iframe id="preview" sandbox="allow-scripts"></iframe></section></div></main></section>
<script type="module" src="app.js"></script></body></html>
